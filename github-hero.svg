<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1199 675"
     width="1199"
     height="675"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Mohamed Hijazy Shazin Hassan — Robotics and Autonomous Systems</title>
  <desc id="desc">Robotics research hero banner with editable SVG text over a photographic robotics scene.</desc>

  <defs>
    <linearGradient id="fadeBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F233A"/>
      <stop offset="100%" stop-color="#0F233A"/>
    </linearGradient>

    <style>
      .hero-image {
        animation: heroFade 6s ease-in-out infinite;
        transform-origin: center;
      }

      .hero-text {
        animation: textFade 6s ease-in-out infinite;
      }

      @keyframes heroFade {
        0%, 100% { opacity: 0.15; }
        33.333% { opacity: 1; }
        66.666% { opacity: 1; }
      }

      @keyframes textFade {
        0%, 100% { opacity: 0.15; }
        33.333% { opacity: 1; }
        66.666% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background used at the faintest point -->
  <rect width="100%" height="100%" fill="url(#fadeBase)"/>

  <!-- Replace github-banner.png with another image if desired -->
  <image
    class="hero-image"
    href="github-banner.png"
    x="0"
    y="0"
    width="1199"
    height="675"
    preserveAspectRatio="xMidYMid slice"
  />

  <!-- Editable text layer -->
  <g class="hero-text"
     text-anchor="middle"
     font-family="DejaVu Sans, Arial, Helvetica, sans-serif">

    <!-- NAME: edit this text directly -->
    <text
      x="599.5"
      y="236.2"
      font-size="40"
      font-weight="700"
      fill="#FFFFFF"
      opacity="0.96"
      style="paint-order:stroke;stroke:#000000;stroke-opacity:0.47;stroke-width:2px;">
      Mohamed Hijazy Shazin Hassan
    </text>

    <!-- TAGLINE: edit this text directly -->
    <text
      x="599.5"
      y="391.5"
      font-size="18"
      font-weight="400"
      fill="#E1EEFA"
      opacity="0.92"
      style="paint-order:stroke;stroke:#000000;stroke-opacity:0.47;stroke-width:1.5px;">
      Robotics · Autonomous Systems · Swarm Intelligence · AI
    </text>

  </g>
</svg>
