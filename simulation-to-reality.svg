<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
<title id="title">From Simulation to Reality</title>
<desc id="desc">Research workflow from theory and algorithms through simulation and hardware integration to a real-world robot.</desc>
<rect width="1600" height="650" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0F172A"/>
</marker>
</defs>

<text x="800" y="48" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#0F172A">SIMULATION &amp; VALIDATION</text>

<g font-family="Arial,Helvetica,sans-serif" fill="#0F172A" text-anchor="middle">
<rect x="70" y="105" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
<text x="200" y="166" font-size="25" font-weight="700">THEORY</text>

<rect x="420" y="105" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
<text x="550" y="166" font-size="25" font-weight="700">ALGORITHM</text>

<rect x="770" y="105" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
<text x="900" y="151" font-size="23" font-weight="700">SOFTWARE</text>
<text x="900" y="180" font-size="23" font-weight="700">MODEL</text>

<rect x="1120" y="105" width="260" height="105" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
<text x="1250" y="166" font-size="25" font-weight="700">SIMULATION</text>
</g>

<g stroke="#0F172A" stroke-width="3" fill="none" marker-end="url(#arrow)">
<line x1="330" y1="157" x2="410" y2="157"/>
<line x1="680" y1="157" x2="760" y2="157"/>
<line x1="1030" y1="157" x2="1110" y2="157"/>
<line x1="1250" y1="210" x2="1250" y2="280"/>
</g>

<rect x="1080" y="300" width="340" height="105" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#0F172A">
<text x="1250" y="346" font-size="22" font-weight="700">SITL / GAZEBO</text>
<text x="1250" y="375" font-size="17" fill="#334155">controlled validation environment</text>
</g>

<line x1="1250" y1="405" x2="1250" y2="455" stroke="#0F172A" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="1000" y="475" width="500" height="105" rx="14" fill="#0F172A" stroke="#0F172A" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<text x="1250" y="519" font-size="22" font-weight="700" fill="#FFFFFF">PERFORMANCE EVALUATION</text>
<text x="1250" y="548" font-size="17" fill="#D7E0EA">measure · compare · refine</text>
</g>

<line x1="1000" y1="527" x2="820" y2="527" stroke="#0F172A" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="450" y="475" width="350" height="105" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#0F172A">
<text x="625" y="519" font-size="22" font-weight="700">HARDWARE INTEGRATION</text>
<text x="625" y="548" font-size="17" fill="#334155">software → physical platform</text>
</g>

<line x1="450" y1="527" x2="270" y2="527" stroke="#0F172A" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="70" y="475" width="350" height="105" rx="14" fill="#0F172A" stroke="#0F172A" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<text x="245" y="519" font-size="23" font-weight="700" fill="#FFFFFF">REAL-WORLD ROBOT</text>
<text x="245" y="548" font-size="17" fill="#D7E0EA">physical deployment</text>
</g>

<text x="800" y="623" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#0F172A">PHYSICAL DEPLOYMENT</text>
</svg>